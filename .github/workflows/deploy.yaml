name: Build and upload assets
on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    name: Building, ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: go.sum

      - name: Build on Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p bin
          go build -ldflags="-s -w" -o ./bin/htnbridge ./cmd/htnbridge
          archive="bin/htn-stratum-bridge-${{ github.event.release.tag_name }}-linux-amd64.zip"
          zip -j "${archive}" ./bin/htnbridge
          echo "archive=${archive}" >> $GITHUB_ENV

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p bin
          go build -ldflags="-s -w" -o ./bin/htnbridge.exe ./cmd/htnbridge
          archive="bin/htn-stratum-bridge-${{ github.event.release.tag_name }}-windows-amd64.zip"
          powershell -Command "Compress-Archive -Path bin/htnbridge.exe -DestinationPath '${archive}' -Force"
          echo "archive=${archive}" >> $GITHUB_ENV

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./${{ env.archive }}
